<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>VN-MURL SafeWeb</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      background: #0a0f1d;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 14px;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tagline {
      font-size: 10px;
      color: #64748b;
    }
    .status-card {
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .status-label {
      font-size: 12px;
      font-weight: 600;
    }
    .status-active {
      color: #10b981;
      font-weight: 700;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .status-paused {
      color: #f59e0b;
      font-weight: 700;
      font-size: 11px;
    }
    .current-url {
      font-size: 11px;
      color: #94a3b8;
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 8px;
    }
    .btn {
      width: 100%;
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 9px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.2s;
    }
    .btn:hover { background: #0369a1; }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .btn-secondary:hover { background: #334155; }
    .result-box {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px;
      font-size: 11px;
      display: none;
      margin-bottom: 8px;
    }
    .result-benign { border-color: #10b981; color: #10b981; }
    .result-phishing { border-color: #ef4444; color: #ef4444; }
    .result-adult { border-color: #f59e0b; color: #f59e0b; }
    .footer {
      text-align: center;
      font-size: 10px;
      color: #475569;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="title">VN-MURL SafeWeb</div>
      <div class="tagline">URL Security &amp; Child-Safe Guard</div>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span class="status-label">Bảo Vệ Thời Gian Thực</span>
      <span id="status-indicator" class="status-active">● ĐANG BẬT</span>
    </div>
    <div id="tab-url" class="current-url">Đang phát hiện tab...</div>
  </div>

  <div id="result-box" class="result-box">
    <div id="result-text" style="font-weight: 700;"></div>
    <div id="result-reason" style="color: #94a3b8; font-size: 10px; margin-top: 4px;"></div>
  </div>

  <button id="btn-scan" class="btn">Quét Tab Hiện Tại</button>
  <button id="btn-toggle" class="btn btn-secondary">Tạm Dừng Bảo Vệ</button>

  <div class="footer">
    Priority: PHISHING &gt; ADULT &gt; BENIGN
  </div>

  <script src="popup.js"></script>
</body>
</html>
