name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-service-check:
    name: AI Service (FastAPI & Model Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/ai-service/requirements.txt

      - name: Install dependencies
        working-directory: src/ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Validate Python syntax & bytecode compilation
        run: python -m compileall src/ai-service

      - name: Run automated AI test suite
        working-directory: src/ai-service
        run: pytest tests/ -v

  api-backend-check:
    name: API Backend (.NET 10 / ASP.NET Core)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore src/api/VnMurlSafeWeb.Api.csproj

      - name: Build ASP.NET Core API in Release mode
        run: dotnet build src/api/VnMurlSafeWeb.Api.csproj -c Release --no-restore

  frontend-check:
    name: Frontend Web (React 18 + Vite + TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        working-directory: src/web
        run: npm ci

      - name: Typecheck and build production bundle
        working-directory: src/web
        run: npm run build

  extension-check:
    name: Browser Extension (Manifest V3 Validation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Manifest V3 JSON format
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('src/browser-extension/manifest.json', 'utf8'));
            if (manifest.manifest_version !== 3) {
              console.error('Error: Manifest version must be 3');
              process.exit(1);
            }
            console.log('Manifest V3 valid. Extension name: ' + manifest.name + ' v' + manifest.version);
          "

